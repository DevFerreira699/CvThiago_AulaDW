let D,view=true;
try{D=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){D=null}

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=p=>p.split(".").reduce((o,k)=>o==null?o:o[k],D);
const val=p=>get("cv."+p);
function set(p,v){const k=p.split(".");const l=k.pop();k.reduce((a,b)=>a[b],D)[l]=v}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
const url=v=>/^https?:/.test(v)?v:"https://"+v;
const filled=o=>Object.values(o).some(v=>Array.isArray(v)?v.length:(v&&v!==0));
const idx=a=>a.map((x,i)=>i).filter(i=>!view||filled(a[i]));

function E(path,ph,type="txt",cls=""){
 const v=val(path);
 const text=type==="csv"?(v||[]).join(", "):type==="lines"?(v||[]).join("\n"):(v===0&&type==="num"?"":v);
 return `<span class="ed ${type==="lines"?"lines":""} ${cls}" ${view?"":'contenteditable="true" spellcheck="false"'} data-path="cv.${path}" data-type="${type}" data-ph="${ph}">${esc(text)}</span>`;
}
const J=(sep,ps)=>ps.filter(p=>!view||p[0]).map(p=>p[1]).join(`<span class="sep"> ${sep} </span>`);
const add=(arr,tpl,label)=>view?"":`<button class="add" data-add="cv.${arr}" data-tpl="${tpl}">+ ${label}</button>`;
const del=(arr,i)=>view?"":`<button class="del" data-del="cv.${arr}" data-i="${i}" title="Remover" aria-label="Remover item">×</button>`;
const chk=(path,label)=>view?"":`<label class="chk"><input type="checkbox" data-chk="cv.${path}" ${val(path)?"checked":""}> ${label}</label>`;
function dates(b,i){
 const s=val(`${b}.${i}.startDate`),e0=val(`${b}.${i}.endDate`),cur=val(`${b}.${i}.current`);
 if(!view)return `${E(`${b}.${i}.startDate`,"início")} <span class="sep">–</span> ${cur?"Atual":E(`${b}.${i}.endDate`,"fim")} ${chk(`${b}.${i}.current`,"atual")}`;
 const e=cur?"Atual":e0;return esc(s&&e?`${s} - ${e}`:s?`desde ${s}`:e);
}
// lista: kind bul|sq|chips ; et = tipo de edição (lines|csv)
function LIST(path,label,ph,kind,et){
 const a=val(path)||[];
 if(!view)return `${label?`<div class="lbl">${label}</div>`:""}${E(path,ph,et)}`;
 if(!a.length)return "";
 const lb=label?`<div class="lbl">${label}</div>`:"";
 if(kind==="chips")return `${lb}<div class="chips">${a.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`;
 return `${lb}<ul class="${kind}">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
}
function row(label,path,ph,href){
 const v=val("personalInformation."+path);
 if(view&&!v)return "";
 const inner=view&&href?`<a href="${esc(href(v))}" target="_blank" rel="noopener">${esc(v)}</a>`:E("personalInformation."+path,ph);
 const ev=path==="phone"&&!view?"":"";
 return `<div class="crow"><small>${label}</small>${inner}${ev}</div>`;
}

 const pr=c.preferences,prefOn=!view||filled(pr);
 const pref=prefOn?`<h2>Preferências</h2>${["targetPositions|Cargos de interesse","targetIndustries|Setores de interesse","preferredLocations|Locais preferidos"].map(s=>{const[k,l]=s.split("|");return LIST("preferences."+k,l,"separe por vírgula","chips","csv")}).join("")}${view&&!pr.preferredWorkModel?"":`<div class="lbl">Modelo preferido</div>${E("preferences.preferredWorkModel","remoto, híbrido, presencial")}`}`:"";
 const summ=`${view&&!c.professionalSummary.description?"":`<div>${E("professionalSummary.description","Escreva um resumo da sua trajetória.")}</div>`}${view?"":`<div class="meta">${E("professionalSummary.yearsOfExperience","0","num")} anos de experiência <span class="sep">|</span> ${E("professionalSummary.mainSpecialization","especialização principal")}</div>`}`;
 const lk=(label,path,ph)=>{const v=val("personalInformation."+path);if(view&&!v)return "";return view?`<a class="lcard" href="${esc(url(v))}" target="_blank" rel="noopener"><b>${label}</b><span>${esc(v)}</span></a>`:`<div class="lcard"><b>${label}</b>${E("personalInformation."+path,ph)}</div>`};
 const lkHtml=lk("Portfólio","portfolio","link do portfólio")+lk("Site","website","www.seusite.com.br");
 const linksSec=view&&!lkHtml?"":`<h2>Links</h2><div class="lgrid">${lkHtml}</div>`;
 const photo=`<div class="photo ${pi.profilePhoto?"has":""} ${view?"":"edit"}" id="photo" ${view?"":'role="button" tabindex="0"'} style="${pi.profilePhoto?`background-image:url('${esc(pi.profilePhoto)}')`:""}"><span>${view?"":"Clique para<br>enviar foto"}</span></div>`;
 document.getElementById("cv").innerHTML=`
 <aside>${photo}

  ${view&&!(c.skills.methodologies.length)?"":`<h3>Metodologias</h3>${LIST("skills.methodologies","","separe por vírgula","sq","csv")}`}
  ${view&&!langs?"":`<h3>Idiomas</h3>${view?`<ul class="sq">${langs}</ul>`:langs+add("languages","lang","Idioma")}`}

 </aside>
 <main>

 document.body.classList.toggle("view",view);
 document.getElementById("bMode").textContent=view?"Editar currículo":"Concluir edição";
 document.getElementById("bClear").hidden=view;
 document.getElementById("hint").textContent=view?"Toque nos contatos para abrir WhatsApp, e-mail e links.":"Modo edição: clique em qualquer campo para alterar. Salvo automaticamente neste navegador.";
}

const cvEl=document.getElementById("cv");
cvEl.addEventListener("input",e=>{
 const el=e.target.closest(".ed");if(!el)return;
 const t=el.dataset.type,txt=el.innerText.replace(/\u00a0/g," ");
 let v=txt.trim();
 if(t==="csv")v=txt.split(",").map(s=>s.trim()).filter(Boolean);
 else if(t==="lines")v=txt.split("\n").map(s=>s.trim()).filter(Boolean);
 else if(t==="num")v=parseFloat(txt.replace(",","."))||0;
 set(el.dataset.path,v);
 if(el.dataset.path==="cv.personalInformation.phone")D.cv.personalInformation.whatsapp=v;
 save();
});
cvEl.addEventListener("keydown",e=>{
 const el=e.target.closest(".ed");
 if(el&&e.key==="Enter"&&el.dataset.type!=="lines")e.preventDefault();
 if(e.target.id==="photo"&&!view&&(e.key==="Enter"||e.key===" ")){e.preventDefault();pickPhoto()}
});
cvEl.addEventListener("paste",e=>{
 if(!e.target.closest(".ed"))return;
 e.preventDefault();
 document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text/plain"));
});
cvEl.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.chk;if(k){set(k,e.target.checked);save();render()}});
cvEl.addEventListener("click",e=>{
 const a=e.target.closest("[data-add]"),d=e.target.closest("[data-del]");
 if(a){get(a.dataset.add).push(T[a.dataset.tpl]());save();render()}
 else if(d){get(d.dataset.del).splice(+d.dataset.i,1);save();render()}
 else if(e.target.closest("#photo")&&!view)pickPhoto();
});
function pickPhoto(){
 const f=document.createElement("input");f.type="file";f.accept="image/*";
 f.onchange=()=>{const file=f.files[0];if(!file)return;
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{
   const s=320,cv=document.createElement("canvas");cv.width=cv.height=s;const m=Math.min(img.width,img.height);
   cv.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);
   D.cv.personalInformation.profilePhoto=cv.toDataURL("image/jpeg",.85);save();render()};img.src=r.result};r.readAsDataURL(file)};
 f.click();
}
const dlg=document.getElementById("dlg"),ta=document.getElementById("ta"),msg=document.getElementById("msg");
const $=id=>document.getElementById(id);
$("bPrint").onclick=()=>{if(!view){view=true;render()}window.print()};
$("bMode").onclick=()=>{view=!view;render()};
$("bTheme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
$("bClear").onclick=()=>{if(confirm("Apagar todo o conteúdo do currículo?")){D=base();save();render()}};
$("bJson").onclick=()=>{D.cv.metadata.lastUpdated=new Date().toISOString().slice(0,10);ta.value=JSON.stringify(D,null,2);msg.textContent="";dlg.showModal()};
$("bClose").onclick=()=>dlg.close();
$("bApply").onclick=()=>{try{const j=JSON.parse(ta.value);if(!j.cv)throw new Error("falta a chave \"cv\".");D={cv:Object.assign(base().cv,j.cv)};save();render();dlg.close()}catch(err){msg.textContent="JSON inválido: "+err.message}};
$("bCopy").onclick=async()=>{try{await navigator.clipboard.writeText(ta.value)}catch(e){ta.select();document.execCommand("copy")}msg.textContent="JSON copiado."};
render();
</script>
</body>
</html>
